o_hodowli: |
  British Valley to domowa hodowla kotów brytyjskich krótkowłosych i długowłosych w Maszkowie pod Koszalinem. Hodowla działa w Felis Polonia, polskim związku zrzeszonym w FIFe. Prowadzi ją Małgorzata Wieliczko.

  Kocięta rodzą się i dorastają w domu, wśród ludzi i innych kotów. Najbardziej lubimy nietypowe kolory: cynamonowy, czekoladowy, rudy, szylkretowy i bicolor. Zdarzają się u nas też kocięta różnookie.
zdjecie_o_hodowli: /img/hodowla.jpg
kocieta_wstep: Mioty z 2026 roku. Dostępność zmienia się szybko, dlatego najpewniej jest zapytać telefonicznie albo w wiadomości na Instagramie.
rezerwacja_wstep: Tak wygląda droga od pierwszej wiadomości do odbioru kocięcia.
kroki:
  - tytul: Wiadomość
    opis: "Zadzwoń albo napisz, jakiego kota szukasz: rasa, płeć, kolor. Opowiedz też krótko o swoim domu."
  - tytul: Rozmowa i odwiedziny
    opis: Odpowiadamy na pytania, wysyłamy zdjęcia i filmy. Hodowlę w Maszkowie można odwiedzić po wcześniejszym umówieniu się.
  - tytul: Zadatek
    opis: Rezerwację potwierdza zadatek i umowa rezerwacyjna.
  - tytul: Odbiór
    opis: Kocię wydajemy z rodowodem Felis Polonia i umową sprzedaży.
kontakt_wstep: Najszybciej odpowiadamy telefonicznie i na Instagramie. Hodowla znajduje się w Maszkowie pod Koszalinem. Wizyty umawiamy wcześniej.
